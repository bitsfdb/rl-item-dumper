name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download BakkesMod SDK
        shell: pwsh
        run: |
          $sdkUrl = "https://github.com/bakkesmodorg/BakkesModSDK/releases/latest/download/BakkesModSDK.zip"
          Invoke-WebRequest $sdkUrl -OutFile BakkesModSDK.zip
          Expand-Archive BakkesModSDK.zip -DestinationPath "$env:APPDATA/bakkesmod/bakkesmod/bakkesmodsdk"

      - name: Configure CMake
        run: cmake -B plugin/build -S plugin -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build plugin/build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItemDumper
          path: plugin/build/Release/ItemDumper.dll
